[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "vatly-fluent-python"
version = "0.1.0a2"
description = "Framework-independent fluent billing integrations built on the Vatly Python SDK"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = ["vatly-api-python==0.1.0a2"]
classifiers = ["Development Status :: 3 - Alpha", "Typing :: Typed", "Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://github.com/vatly/vatly-fluent-python"
Documentation = "https://docs.vatly.com"
Issues = "https://github.com/vatly/vatly-fluent-python/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "mypy>=1.18,<2", "twine>=6,<7"]

[tool.uv]
required-version = ">=0.12.9"

[tool.uv.sources]
vatly-api-python = {path = "vendor/vatly_api_python-0.1.0a2-py3-none-any.whl"}

[tool.hatch.build.targets.wheel]
packages = ["src/vatly_fluent"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "scripts", "vendor", "docs", "README.md", "PORTING.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/vatly_fluent", "examples"]
