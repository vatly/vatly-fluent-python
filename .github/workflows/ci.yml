name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.9'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=markdown-append:$GITHUB_STEP_SUMMARY
      - run: uv build && uv run twine check dist/* && uv run python scripts/check_package.py
